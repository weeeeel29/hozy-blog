name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 還沒設定 secret 時直接跳過，不要讓整個 workflow 標紅
      - name: Check credentials
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過部署。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: node build.mjs

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 複製 token 時很容易夾帶換行或前後空白，那會讓 Authorization 標頭格式錯誤
          # （Cloudflare 回 code 6111）。這裡先清乾淨再交給 wrangler。
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"

          echo "token 長度：${#TOKEN}（原始 ${#RAW_TOKEN}）"

          CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" \
            npx --yes wrangler@4 pages deploy dist \
              --project-name hozy-blog \
              --branch main \
              --commit-dirty=true
